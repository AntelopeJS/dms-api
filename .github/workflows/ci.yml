name: ci

on:
  push:
    branches:
      - main
  # No branch filter: the lint wave stacks pull requests on top of each other,
  # and a filter on `main` left every intermediate step ungated -- only the
  # secret scanner ran.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v1
    with:
      # `pnpm run checks` typechecks without emitting; the build also checks
      # the declaration output that gets published.
      extra-commands: pnpm build

  # Branch protection requires the `ubuntu` check.
  ubuntu:
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
