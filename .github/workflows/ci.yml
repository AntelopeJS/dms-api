name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: Run the nightly tier, with the Windows jobs and Stress
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v2
    with:
      docs-files: |
        README.md
        docs
      renovate-sync: false
      test-job: true
      # Builds and typechecks the frontend layer against the DMS layer from
      # the `@antelopejs/dms` devDependency: no running backend needed.
      extra-commands: pnpm test:frontend
      extra-commands-job: true
      affected-tests: true
      nightly: ${{ inputs.nightly == true }}
    permissions:
      contents: read

  select:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      run: ${{ steps.tier.outputs.run }}
      e2e: ${{ steps.tier.outputs.e2e }}
    steps:
      - name: Pick the tier with the shared rule
        id: pick
        uses: AntelopeJS/.github/.github/actions/ci-tier@v2
      - name: Pick the tier from the event, the target branch and the draft flag
        id: tier
        env:
          TIER: ${{ steps.pick.outputs.tier }}
          EVENT: ${{ github.event_name }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          tier="$TIER"

          run=true
          e2e=smoke
          if [[ "$tier" == none || "$tier" == draft ]]; then
            run=false
            e2e=none
          elif [[ "$EVENT" =~ ^(merge_group|schedule|workflow_dispatch)$ || "$FULL_LABEL" == true ]]; then
            e2e=all
          fi

          {
            echo "tier=${tier}"
            echo "run=${run}"
            echo "e2e=${e2e}"
          } >> "$GITHUB_OUTPUT"
          echo "Tier \`${tier}\`: own jobs run ${run}, browser journeys ${e2e}" >> "$GITHUB_STEP_SUMMARY"

  formal-route-statistics:
    needs: select
    if: needs.select.outputs.run == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/antelopejs-formal
          key: tla2tools-1.7.4
      - run: node .agents/skills/formal-route-statistics/check.mjs

  # `pnpm run checks` typechecks without emitting; the build also checks
  # the declaration output that gets published.
  build:
    needs: select
    if: needs.select.outputs.run == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build

  # The journeys that call the API or run commands, as Vitest integration
  # tests against backends of the e2e playground on one MongoDB.
  journeys:
    needs: select
    if: needs.select.outputs.run == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mongodb-binaries
          key: journeys-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm e2e:build
      - run: pnpm test:journeys

  # The journeys of e2e/ as a Playwright suite: the @smoke ones on a pull
  # request or a push, every journey in two shards in the merge queue, the
  # nightly run, a manual run and a pull request labelled ci:full, nothing on
  # a draft. `pnpm e2e:build` builds the module and the playground, then the
  # kit's global setup starts one run of them.
  e2e:
    needs: select
    if: needs.select.outputs.e2e != 'none'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.e2e == 'all' && '[1, 2]' || '[1]') }}
    env:
      E2E: ${{ needs.select.outputs.e2e }}
      DMS_E2E_PREBUILT: "1"
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          echo "DMS_E2E_RUNS=${RUNNER_TEMP}/dms-runs" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/mongodb-binaries
            ~/.cache/ms-playwright
          key: e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'playground/pnpm-lock.yaml') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/dms-e2e/frontend
          key: dms-e2e-frontend-${{ github.sha }}
          restore-keys: dms-e2e-frontend-
      - name: Install Chromium, and its system packages when the runner lacks one
        run: |
          pnpm exec playwright install --only-shell chromium
          shell=$(find ~/.cache/ms-playwright -type f -name chrome-headless-shell | head -n 1)
          missing=$(ldd "$shell" | grep "not found" || true)
          if [ -z "$missing" ]; then
            exit 0
          fi
          echo "$missing"
          if ! timeout 240 pnpm exec playwright install-deps chromium; then
            echo "::warning::Chromium's system packages did not install"
          fi
      - run: pnpm e2e:build
      - if: env.E2E == 'smoke'
        run: pnpm e2e --grep @smoke
      - if: env.E2E == 'all'
        run: pnpm e2e --shard=${{ matrix.shard }}/2 --reporter=blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: e2e/blob-report
      - if: success() || failure()
        run: pnpm exec tsc --noEmit -p e2e
      - if: always() && env.E2E == 'all'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report
          retention-days: 3
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-evidence-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
            ${{ runner.temp }}/dms-runs/*/evidence
            ${{ runner.temp }}/dms-runs/*/logs
          retention-days: 7

  # One HTML and JSON report of the shards of a run of every journey.
  e2e-report:
    needs: [select, e2e]
    if: always() && needs.select.outputs.e2e == 'all'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: e2e/blob-reports
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter html,json e2e/blob-reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: e2e/playwright-report
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e/playwright-report/results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  # Branch protection requires the `ubuntu` check. A draft pull request fails
  # it, so merge-when-green cannot merge on the draft run.
  ubuntu:
    if: always()
    needs:
      - select
      - ci
      - build
      - formal-route-statistics
      - journeys
      - e2e
      - e2e-report
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - if: >-
          needs.select.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.ci.result == 'skipped' || (needs.select.outputs.run == 'true' && (needs.build.result == 'skipped' || needs.formal-route-statistics.result == 'skipped' || needs.journeys.result == 'skipped')) || (needs.select.outputs.e2e != 'none' && needs.e2e.result == 'skipped')
        run: exit 1
      - if: needs.select.outputs.tier == 'draft'
        run: |
          echo "::error::Draft pull request: only lint and typecheck ran. Mark it ready for review to run the tests."
          exit 1
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
      statuses: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v2
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
  verdict:
    needs:
      - ci
      - select
      - formal-route-statistics
      - build
      - journeys
      - e2e
      - e2e-report
      - ubuntu
      - renovate-sync
    if: ${{ !cancelled() }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "$failed"
            exit 1
          fi
